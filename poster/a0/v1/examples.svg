<text x="718.04" y="86" font-size="28" fill="#e11d48" font-weight="700">61</text>
<text x="757.4" y="84" font-size="14.5" fill="#64748b">users, 46% of high-risk users missed</text>
<text x="631.0" y="116" font-size="13.5" fill="#1e293b" font-weight="700">Example: true score 5, model score 0.17 (threshold 0.22)</text>
<rect x="631.0" y="131" width="4" height="40.2" rx="2" fill="#e11d48" opacity="0.5"/>
<text x="647.0" y="146.0" font-size="16" fill="#334155" font-style="italic">“I saw my dad have a stroke that night and I would never</text>
<text x="647.0" y="167.6" font-size="16" fill="#334155" font-style="italic">wish that upon my worst enemy.”</text>
<rect x="631.0" y="182.2" width="4" height="18.6" rx="2" fill="#e11d48" opacity="0.5"/>
<text x="647.0" y="197.2" font-size="16" fill="#334155" font-style="italic">“Brooding, loving, and hopeless.... Lol hmmmm”</text>
<text x="631.0" y="282" font-size="14.5" fill="#e11d48" font-weight="700">Rare distress, buried among 189 mostly cheerful posts.</text>
<rect x="58.0" y="312" width="539.0" height="252" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
