<text x="94.0" y="412.0" font-size="16" fill="#334155" font-style="italic">“I'm still in quite the depressive funk, and only haven't</text>
<text x="94.0" y="433.6" font-size="16" fill="#334155" font-style="italic">left work early because I left early yesterday.”</text>
<text x="78.0" y="548" font-size="14.5" fill="#e11d48" font-weight="700">Self-critical, low-mood posts, but no reported ideation.</text>
<rect x="611.0" y="312" width="539.0" height="252" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<rect x="631.0" y="328" width="80.88" height="28" rx="14" fill="#0f766e"/>
<text x="671.44" y="347" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Correct</text>
<text x="725.88" y="352" font-size="28" fill="#0f766e" font-weight="700">703</text>
<text x="780.92" y="350" font-size="14.5" fill="#64748b">users, 81% of other users cleared</text>
<text x="631.0" y="382" font-size="13.5" fill="#1e293b" font-weight="700">Example: true score 0, model score 0.29 (threshold 0.43)</text>
<rect x="631.0" y="397" width="4" height="40.2" rx="2" fill="#0f766e" opacity="0.5"/>
<text x="647.0" y="412.0" font-size="16" fill="#334155" font-style="italic">“Someone just asked me how my dad was, and I said "Dead,</text>
<text x="647.0" y="433.6" font-size="16" fill="#334155" font-style="italic">so not great". I didn't do that right, did I?”</text>
<rect x="631.0" y="448.2" width="4" height="61.80000000000001" rx="2" fill="#0f766e" opacity="0.5"/>
<text x="647.0" y="463.2" font-size="16" fill="#334155" font-style="italic">“Sometimes I wonder if I missed the day in kindergarten</text>
<text x="647.0" y="484.8" font-size="16" fill="#334155" font-style="italic">when all the other kids learned how to deal with their</text>
<text x="647.0" y="506.4" font-size="16" fill="#334155" font-style="italic">feelings.”</text>
<text x="631.0" y="548" font-size="14.5" fill="#0f766e" font-weight="700">Death and feelings come up only as jokes.</text>
