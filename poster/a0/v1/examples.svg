<text x="134.12" y="347" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">False alarm</text>
<text x="204.24" y="352" font-size="28" fill="#e11d48" font-weight="700">168</text>
<text x="259.28000000000003" y="350" font-size="14.5" fill="#64748b">users, 19% of other users flagged</text>
<text x="78.0" y="382" font-size="13.5" fill="#1e293b" font-weight="700">Example: true score 0, model score 0.88 (threshold 0.38)</text>
