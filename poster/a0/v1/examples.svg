<text x="212.24" y="84" font-size="14.5" fill="#64748b">users, 54% of high-risk users flagged</text>
<text x="78.0" y="116" font-size="13.5" fill="#1e293b" font-weight="700">Example: true score 5, model score 0.46 (threshold 0.22)</text>
