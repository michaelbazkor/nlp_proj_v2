<text x="94.0" y="146.0" font-size="16" fill="#334155" font-style="italic">“i think a Lot of ppl who see me constantly talking abt</text>
<text x="94.0" y="167.6" font-size="16" fill="#334155" font-style="italic">suicide think im joking? but honestly the reality is im</text>
<text x="94.0" y="189.2" font-size="16" fill="#334155" font-style="italic">not ever joking and i am willing and ready to die at a</text>
<text x="94.0" y="210.8" font-size="16" fill="#334155" font-style="italic">moments notice”</text>
<text x="78.0" y="282" font-size="14.5" fill="#0f766e" font-weight="700">Open, repeated talk of suicide across 933 posts.</text>
<rect x="611.0" y="46" width="539.0" height="252" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
<rect x="631.0" y="62" width="73.04" height="28" rx="14" fill="#e11d48"/>
