<text x="256" y="292" font-size="13" fill="#1e293b" font-weight="700">Example: true score 5</text>
<text x="828" y="292" font-size="13" fill="#0f766e" font-weight="700" text-anchor="end">model score 0.99</text>
<rect x="256" y="316" width="572" height="10" rx="5" fill="#e2e8f0"/>
<rect x="256" y="316" width="568.2" height="10" rx="5" fill="#0f766e" opacity="0.85"/>
<line x1="556.488811779022" y1="310" x2="556.488811779022" y2="332" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="824.1796810626984" cy="321" r="7" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
<text x="256" y="348" font-size="11" fill="#64748b">0</text>
<text x="828" y="348" font-size="11" fill="#64748b" text-anchor="end">1</text>
<text x="556.488811779022" y="306" font-size="11" fill="#1e293b">threshold 0.53</text>
<rect x="256" y="373" width="4" height="61" rx="2" fill="#0f766e" opacity="0.5"/>
<text x="272" y="388.0" font-size="15" fill="#334155" font-style="italic">“i think a Lot of ppl who see me constantly talking abt suicide think</text>
<text x="272" y="409.0" font-size="15" fill="#334155" font-style="italic">im joking? but honestly the reality is im not ever joking and i am</text>
<text x="272" y="430.0" font-size="15" fill="#334155" font-style="italic">willing and ready to die at a moments notice”</text>
<rect x="256" y="448.0" width="4" height="61" rx="2" fill="#0f766e" opacity="0.5"/>
<text x="272" y="463.0" font-size="15" fill="#334155" font-style="italic">“Mental illness is a series of questions like when have I eaten last?</text>
<text x="272" y="484.0" font-size="15" fill="#334155" font-style="italic">Why am I crying in the bathroom at 5:16 in the pm? Was I always this</text>
<text x="272" y="505.0" font-size="15" fill="#334155" font-style="italic">sad for no reason???”</text>
<text x="256" y="560" font-size="13" fill="#0f766e" font-weight="700">Open, repeated talk of suicide across 933 posts.</text>
<rect x="868" y="150" width="620" height="430" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
<rect x="892" y="172" width="73.6" height="26" rx="13" fill="#e11d48"/>
<text x="928.8" y="190" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Missed</text>
<text x="892" y="248" font-size="44" fill="#e11d48" font-weight="700">69</text>
<text x="958" y="228" font-size="16" fill="#1e293b" font-weight="700">52%</text>
<text x="958" y="248" font-size="13" fill="#64748b">of high-risk users missed</text>
<line x1="892" y1="268" x2="1464" y2="268" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="892" y="292" font-size="13" fill="#1e293b" font-weight="700">Example: true score 5</text>
<text x="1464" y="292" font-size="13" fill="#e11d48" font-weight="700" text-anchor="end">model score 0.00</text>
<rect x="892" y="316" width="572" height="10" rx="5" fill="#e2e8f0"/>
<rect x="892" y="316" width="10" height="10" rx="5" fill="#e11d48" opacity="0.85"/>
<line x1="1192.488811779022" y1="310" x2="1192.488811779022" y2="332" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="892.0000488914284" cy="321" r="7" fill="#ffffff" stroke="#e11d48" stroke-width="2.5"/>
<text x="892" y="348" font-size="11" fill="#64748b">0</text>
<text x="1464" y="348" font-size="11" fill="#64748b" text-anchor="end">1</text>
<text x="1192.488811779022" y="306" font-size="11" fill="#1e293b">threshold 0.53</text>
<rect x="892" y="373" width="4" height="40" rx="2" fill="#e11d48" opacity="0.5"/>
<text x="908" y="388.0" font-size="15" fill="#334155" font-style="italic">“I saw my dad have a stroke that night and I would never wish that upon</text>
<text x="908" y="409.0" font-size="15" fill="#334155" font-style="italic">my worst enemy.”</text>
<rect x="892" y="427.0" width="4" height="40" rx="2" fill="#e11d48" opacity="0.5"/>
<text x="908" y="442.0" font-size="15" fill="#334155" font-style="italic">“Never let yourself get so far down a hole to where you feel you can't</text>
<text x="908" y="463.0" font-size="15" fill="#334155" font-style="italic">see the top.”</text>
<rect x="892" y="481.0" width="4" height="19" rx="2" fill="#e11d48" opacity="0.5"/>
<text x="908" y="496.0" font-size="15" fill="#334155" font-style="italic">“Brooding, loving, and hopeless.... Lol hmmmm”</text>
<text x="892" y="560" font-size="13" fill="#e11d48" font-weight="700">Rare distress, buried among 189 mostly cheerful posts.</text>
<rect x="232" y="596" width="620" height="430" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
<rect x="256" y="618" width="111.6" height="26" rx="13" fill="#e11d48"/>
<text x="311.8" y="636" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">False alarm</text>
<text x="256" y="694" font-size="44" fill="#e11d48" font-weight="700">162</text>
<text x="348" y="674" font-size="16" fill="#1e293b" font-weight="700">19%</text>
<text x="348" y="694" font-size="13" fill="#64748b">of other users flagged</text>
<line x1="256" y1="714" x2="828" y2="714" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="256" y="738" font-size="13" fill="#1e293b" font-weight="700">Example: true score 0</text>
<text x="828" y="738" font-size="13" fill="#e11d48" font-weight="700" text-anchor="end">model score 1.00</text>
<rect x="256" y="762" width="572" height="10" rx="5" fill="#e2e8f0"/>
<rect x="256" y="762" width="571.9" height="10" rx="5" fill="#e11d48" opacity="0.85"/>
<line x1="258.9827278055251" y1="756" x2="258.9827278055251" y2="778" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="827.9170155525208" cy="767" r="7" fill="#ffffff" stroke="#e11d48" stroke-width="2.5"/>
<text x="256" y="794" font-size="11" fill="#64748b">0</text>
<text x="828" y="794" font-size="11" fill="#64748b" text-anchor="end">1</text>
<text x="258.9827278055251" y="752" font-size="11" fill="#1e293b">threshold 0.01</text>
<rect x="256" y="819" width="4" height="61" rx="2" fill="#e11d48" opacity="0.5"/>
<text x="272" y="834.0" font-size="15" fill="#334155" font-style="italic">“My kids are growing up around me and I still haven't given them the</text>
<text x="272" y="855.0" font-size="15" fill="#334155" font-style="italic">life I wanted to. I can't help but feel like I'm failing. Too little,</text>
<text x="272" y="876.0" font-size="15" fill="#334155" font-style="italic">too late.”</text>
<rect x="256" y="894.0" width="4" height="40" rx="2" fill="#e11d48" opacity="0.5"/>
<text x="272" y="909.0" font-size="15" fill="#334155" font-style="italic">“I truly feel like a caged bird, unable to express my potpourri of</text>
<text x="272" y="930.0" font-size="15" fill="#334155" font-style="italic">emotions and thoughts using a creative medium.”</text>
<text x="256" y="1006" font-size="13" fill="#e11d48" font-weight="700">Self-critical, low-mood posts, but no reported ideation.</text>
<rect x="868" y="596" width="620" height="430" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<rect x="892" y="618" width="81.19999999999999" height="26" rx="13" fill="#0f766e"/>
<text x="932.6" y="636" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Correct</text>
<text x="892" y="694" font-size="44" fill="#0f766e" font-weight="700">709</text>
<text x="984" y="674" font-size="16" fill="#1e293b" font-weight="700">81%</text>
<text x="984" y="694" font-size="13" fill="#64748b">of other users cleared</text>
<line x1="892" y1="714" x2="1464" y2="714" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="892" y="738" font-size="13" fill="#1e293b" font-weight="700">Example: true score 0</text>
<text x="1464" y="738" font-size="13" fill="#0f766e" font-weight="700" text-anchor="end">model score 0.00</text>
