<rect width="1500" height="1054" fill="#ffffff"/>
<text x="32" y="46" font-size="28" fill="#1e293b" font-weight="700">Where the reported model was right and wrong</text>
<text x="32" y="76" font-size="14" fill="#64748b">Held-out users at each fold's development-F1 threshold, the most extreme score in each cell. Quotes are verbatim excerpts from that user's posts; names are removed.</text>
<rect x="232" y="102" width="620" height="36" rx="18" fill="#f1f5f9"/>
<text x="542.0" y="126" font-size="15" fill="#1e293b" font-weight="700" text-anchor="middle">Model: high risk</text>
<rect x="868" y="102" width="620" height="36" rx="18" fill="#f1f5f9"/>
<text x="1178.0" y="126" font-size="15" fill="#1e293b" font-weight="700" text-anchor="middle">Model: not high risk</text>
