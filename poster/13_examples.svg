<rect x="892" y="762" width="10" height="10" rx="5" fill="#0f766e" opacity="0.85"/>
<line x1="894.9827278055251" y1="756" x2="894.9827278055251" y2="778" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="892.0" cy="767" r="7" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
<text x="892" y="794" font-size="11" fill="#64748b">0</text>
<text x="1464" y="794" font-size="11" fill="#64748b" text-anchor="end">1</text>
<text x="894.9827278055251" y="752" font-size="11" fill="#1e293b">threshold 0.01</text>
<rect x="892" y="819" width="4" height="40" rx="2" fill="#0f766e" opacity="0.5"/>
<text x="908" y="834.0" font-size="15" fill="#334155" font-style="italic">“Someone just asked me how my dad was, and I said "Dead, so not great".</text>
<text x="908" y="855.0" font-size="15" fill="#334155" font-style="italic">I didn't do that right, did I?”</text>
<rect x="892" y="873.0" width="4" height="40" rx="2" fill="#0f766e" opacity="0.5"/>
<text x="908" y="888.0" font-size="15" fill="#334155" font-style="italic">“Sometimes I wonder if I missed the day in kindergarten when all the</text>
<text x="908" y="909.0" font-size="15" fill="#334155" font-style="italic">other kids learned how to deal with their feelings.”</text>
<text x="892" y="1006" font-size="13" fill="#0f766e" font-weight="700">Death and feelings come up only as jokes.</text>
</svg>