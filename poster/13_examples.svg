<text x="124.0" y="789.0" font-size="12" fill="#64748b" text-anchor="middle">True label</text>
<text x="124.0" y="815.0" font-size="18" fill="#1e293b" font-weight="700" text-anchor="middle">Not high risk</text>
<text x="124.0" y="837.0" font-size="12.5" fill="#64748b" text-anchor="middle">true score 0–2</text>
<text x="124.0" y="857.0" font-size="12.5" fill="#64748b" text-anchor="middle">871 users</text>
<rect x="232" y="150" width="620" height="430" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<rect x="256" y="172" width="81.19999999999999" height="26" rx="13" fill="#0f766e"/>
<text x="296.6" y="190" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Correct</text>
<text x="256" y="248" font-size="44" fill="#0f766e" font-weight="700">63</text>
<text x="322" y="228" font-size="16" fill="#1e293b" font-weight="700">48%</text>
<text x="322" y="248" font-size="13" fill="#64748b">of high-risk users flagged</text>
