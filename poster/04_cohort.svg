<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="280" viewBox="0 0 1400 280" font-family="Arial, Helvetica, sans-serif">
  <rect width="1400" height="280" fill="#ffffff"/>
  <text x="40" y="42" font-size="28" font-weight="700" fill="#1e293b">Cohort and split</text>

  <rect x="40" y="80" width="300" height="150" rx="14" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="190" y="140" text-anchor="middle" font-size="36" font-weight="700" fill="#1e293b">1003</text>
  <text x="190" y="172" text-anchor="middle" font-size="16" fill="#64748b">users with posts</text>
  <text x="190" y="196" text-anchor="middle" font-size="16" fill="#64748b">and clinical scores</text>

  <rect x="380" y="80" width="340" height="150" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="550" y="132" text-anchor="middle" font-size="36" font-weight="700" fill="#1e293b">132</text>
  <text x="550" y="164" text-anchor="middle" font-size="16" fill="#1e293b">high risk · 13%</text>
  <text x="550" y="190" text-anchor="middle" font-size="15" fill="#64748b">suicide score at least 3</text>

  <rect x="760" y="80" width="600" height="150" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1060" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">5 stratified folds · seed 42</text>
  <text x="1060" y="158" text-anchor="middle" font-size="16" fill="#1e293b">Train, then development, inside each fold</text>
  <text x="1060" y="186" text-anchor="middle" font-size="16" fill="#64748b">The test fold is scored once, at the end</text>
</svg>
