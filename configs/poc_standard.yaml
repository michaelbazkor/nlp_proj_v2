# Proof-of-concept config for CPU-only VM (30 users, tiny models).
# Real H100 run uses configs/real.yaml — same code path, different knobs.

seed: 42
experiment: standard   # text_only | standard | subject_details | llama_only

paths:
  root: .
  user_csv: material/user_data (1).csv
  posts_csv: material/facebook_data.csv
  pics_zip: pics.zip
  artifacts: artifacts
  reports: reports

cohort:
  min_status_posts: 10          # status_posts > 9
  groups: [0, 1]
  n_users: 30                   # null => all eligible users
  # Stratified sample of 30 on high-risk labels
  stratify_on: y_high

posts:
  include_post_description: false
  include_attachment_title: false
  require_text_or_image: true
  max_posts_per_user: 40        # POC cap; null on real run
  shuffle_seed: 42

images:
  max_images_per_user: 10       # POC cap
  caption_model: HuggingFaceTB/SmolVLM-256M-Instruct
  caption_prompt: >
    You are analyzing a social media image for an academic mental health research dataset.
    Provide a clear, objective, and detailed description of the image in 2-4 sentences.

    Your description should cover:
    - Main Content: Objects, scene/environment, people present and actions.
    - Mood & Atmosphere: The visual tone, lighting, and overall aesthetic (e.g., somber/isolated, bright/festive, dark, chaotic).
    - Text in Image: Transcribe any visible text, quotes, or meme text verbatim (you can exceed the 2-4 sentence limit if necessary).

    Do not invent details that are not visible, focus on what is visually present.
    Do not make clinical diagnoses, maintain objective tone.
  max_new_tokens: 128
  batch_size: 1
  device: cpu
  dtype: float32

corpus:
  include_images: true
  include_subject_details: false
  post_marker: "[post]"
  image_marker: "[image]"
  subject_marker: "[subject details]"

represent:
  models:
    - name: qwen3_0_6b
      hf_id: Qwen/Qwen3-0.6B
      max_context: 4096
      layer_taps: 4             # evenly spaced across depth
      layer_stride: null
      dtype: float32
      device: cpu
      enable_thinking: true
      max_new_tokens: 256
    - name: smollm2_360m
      hf_id: HuggingFaceTB/SmolLM2-360M-Instruct
      max_context: 4096
      layer_taps: 4
      layer_stride: null
      dtype: float32
      device: cpu
      enable_thinking: false
      max_new_tokens: 256
  positions: [input_only, last_prompt, cot, final_pred]
  # Posts are substituted at [insert posts here] by build_user_prompt
  task_prompt: |
    You are an expert supervisor evaluating suicide-risk signals in social media language.
    Input: a collection of Facebook posts authored by a single user. (order is arbitrary)
    Asses if language indicates an evolving trajectory of suicidal ideation.

    Suicidal ideation often manifests as severe social isolation, thwarted belongingness, or perceiving oneself as a burden to others. 
    Look for expressions of intense emotional pain, inescapable entrapment, or severe hopelessness regarding the future.
    Pay close attention to explicit or implicit references to death, self-harm, or escalating mental health distress.
    Remember that majority of users do not have suicidal ideation, do not overinterpret posts that are not overtly suicidal.
    
    User posts:
    [insert posts here]
    
    Format your answer exactly as:
    Rationale: <2-3 sentences>
    Prediction: RISK=<1 for elevated risk, 0 for low risk>
  target_dim: 1024

fusion:
  method: per_block_pca
  target_dim: 1024
  # Fitted per CV fold on train only

train:
  n_folds: 5
  train_frac: 0.70
  dev_frac: 0.15
  test_frac: 0.15
  batch_size: 8                 # small for 30-user POC
  optimizer: rmsprop
  momentum: 0.9
  # Reduced grid for POC (full grid in real.yaml)
  grid:
    n_layers: [1, 2]
    n_neurons: [16, 32]
    activation: [tanh, sigmoid]
    lr: [0.001, 0.01]
    epochs: [200, 500]
  early_stop_patience: 50
  variants:
    - {model: stm, target: high}
    - {model: mtm, target: high}
  aux_targets:
    - PHQ9
    - GAD
    - Brooding
    - Worry
    - SWL
    - Lonely
    - BFI_O
    - BFI_C
    - BFI_E
    - BFI_A
    - BFI_N
