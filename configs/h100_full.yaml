# H100 full cohort run (~1006 users) — Phase 1 extract + Phase 2 train matrix (8 configs)
#
# Usage (single command):
#   pip install -e ".[h100]"
#   python scripts/run_h100_full.py
#   python scripts/run_h100_full.py --phase train          # skip extract if reps cached
#   python scripts/run_h100_full.py --phase represent --force

seed: 42
experiment: h100_full

paths:
  root: .
  user_csv: material/user_data (1).csv
  posts_csv: material/facebook_data.csv
  pics_zip: pics.zip
  artifacts: artifacts
  reports: reports

cohort:
  min_status_posts: 10
  groups: [0, 1]
  n_users: null
  stratify_on: y_high

posts:
  include_post_description: false
  include_attachment_title: false
  require_text_or_image: true
  max_posts_per_user: null
  shuffle_seed: 42

images:
  max_images_per_user: null
  caption_model: Qwen/Qwen2.5-VL-7B-Instruct
  caption_prompt: >
    Describe this social-media image briefly (1-2 sentences).
    Focus on visual cues that may relate to emotional distress,
    isolation, self-harm, substance use, or overall mood.
    Do not invent details that are not visible.
  max_new_tokens: 80
  batch_size: 8
  device: cuda
  dtype: bfloat16
  flash_attention: true

corpus:
  include_images: true
  include_subject_details: false
  post_marker: "[post]"
  image_marker: "[image]"
  subject_marker: "[subject details]"

represent:
  # Sequential load — one model at a time (see extract.py)
  models:
    - name: qwen3_32b
      hf_id: Qwen/Qwen3-32B
      max_context: 32768
      layer_stride: 20
      dtype: bfloat16
      device: cuda
      device_map: auto
      flash_attention: true
      enable_thinking: true
      max_new_tokens: 256
    - name: deepseek_r1_distill_qwen_32b
      hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
      max_context: 32768
      layer_stride: 20
      dtype: bfloat16
      device: cuda
      device_map: auto
      flash_attention: true
      enable_thinking: true
      max_new_tokens: 256
    - name: gemma3_27b
      hf_id: google/gemma-3-27b-it
      max_context: 32768
      layer_stride: 20
      dtype: bfloat16
      device: cuda
      device_map: auto
      flash_attention: true
      enable_thinking: false
      max_new_tokens: 256
    - name: llama_3_3_70b
      hf_id: meta-llama/Llama-3.3-70B-Instruct
      max_context: 32768
      layer_stride: 20
      # Single H100 80GB: 4-bit NF4 (~40 GB). Dual H100: set dtype bfloat16, device_map auto
      dtype: 4bit
      load_in_4bit: true
      bnb_compute_dtype: bfloat16
      device: cuda
      device_map: auto
      flash_attention: true
      enable_thinking: false
      max_new_tokens: 256
  positions: [input_only, last_prompt, cot, final_pred]
  task_prompt: |
    You are assisting a research study on suicide-risk signals in social media language.
    Below is one user's Facebook posts (order is arbitrary; treat them as a set).
    Identify trends that might indicate development of suicidal ideation.
    Example trends include hopelessness, isolation, references to death,
    substance use, or mental health treatment.
    Format your answer exactly as:
    Rationale: <a few sentences>
    Prediction: RISK=<1 for elevated risk, 0 for no/low risk>

fusion:
  target_dim: 1024
  attention:
    lr: 0.01
    epochs: 1000
    patience: 100
    device: cuda

train:
  eval_target: high
  n_folds: 5
  train_frac: 0.70
  dev_frac: 0.15
  test_frac: 0.15
  batch_size: 64
  optimizer: rmsprop
  momentum: 0.9
  grid:
    n_layers: [1, 2, 3]
    n_neurons: [32, 64, 128, 256]
    activation: [tanh, sigmoid]
    lr: [0.001, 0.005, 0.01]
    epochs: [1000, 2500]
  early_stop_patience: 200
