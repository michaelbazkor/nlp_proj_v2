# Full H100 run config. Same pipeline code as POC; only knobs change.

seed: 42
experiment: standard

paths:
  root: .
  user_csv: material/user_data (1).csv
  posts_csv: material/facebook_data.csv
  pics_zip: pics.zip
  artifacts: artifacts
  reports: reports

cohort:
  min_status_posts: 10
  groups: [0, 1]
  n_users: null
  stratify_on: y_general

posts:
  include_post_description: false
  include_attachment_title: false
  require_text_or_image: true
  max_posts_per_user: null
  shuffle_seed: 42

images:
  max_images_per_user: null
  caption_model: Qwen/Qwen2.5-VL-7B-Instruct
  caption_prompt: >
    Describe this social-media image briefly (1-2 sentences).
    Focus on visual cues that may relate to emotional distress,
    isolation, self-harm, substance use, or overall mood.
    Do not invent details that are not visible.
  max_new_tokens: 80
  batch_size: 8
  device: cuda
  dtype: bfloat16

corpus:
  include_images: true
  include_subject_details: false
  post_marker: "[post]"
  image_marker: "IMAGE_DESCRIPTIONS:"
  subject_marker: "[subject details]"

represent:
  models:
    - name: llama_3_3_70b
      hf_id: meta-llama/Llama-3.3-70B-Instruct
      max_context: 131072
      layer_taps: null
      layer_stride: 20
      dtype: float8_e4m3fn
      device: cuda
      enable_thinking: false
      max_new_tokens: 256
    - name: qwen3_32b
      hf_id: Qwen/Qwen3-32B
      max_context: 131072
      layer_taps: null
      layer_stride: 20
      dtype: bfloat16
      device: cuda
      enable_thinking: true
      max_new_tokens: 256
    - name: deepseek_r1_distill_qwen_32b
      hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
      max_context: 131072
      layer_taps: null
      layer_stride: 20
      dtype: bfloat16
      device: cuda
      enable_thinking: true
      max_new_tokens: 256
    - name: gemma4_26b_moe
      hf_id: google/gemma-4-26b-it
      max_context: 131072
      layer_taps: null
      layer_stride: 20
      dtype: bfloat16
      device: cuda
      enable_thinking: false
      max_new_tokens: 256
  positions: [input_only, last_prompt, cot, final_pred]
  task_prompt: |
    You are assisting a research study on suicide-risk signals in social media language.
    Below is one user's Facebook posts (order is arbitrary; treat them as a set).
    Provide a short rationale, then give a final prediction as one of:
      RISK=0 (no/low risk) or RISK=1 (elevated risk).
    Format your answer exactly as:
    Rationale: <1-3 sentences>
    Prediction: RISK=<0 or 1>
  target_dim: 1024

fusion:
  method: per_block_pca
  target_dim: 1024

train:
  n_folds: 5
  train_frac: 0.70
  dev_frac: 0.15
  test_frac: 0.15
  batch_size: 32
  optimizer: rmsprop
  momentum: 0.9
  grid:
    n_layers: [1, 2, 3]
    n_neurons: [16, 32, 64, 128, 256, 512, 1024]
    activation: [tanh, sigmoid]
    lr: [0.001, 0.005, 0.01, 0.05]
    epochs: [1000, 2500, 5000]
  early_stop_patience: 200
  variants:
    - {model: stm, target: general}
    - {model: stm, target: high}
    - {model: mtm, target: general}
    - {model: mtm, target: high}
  aux_targets:
    - PHQ9
    - GAD
    - Brooding
    - Worry
    - SWL
    - Lonely
    - BFI_O
    - BFI_C
    - BFI_E
    - BFI_A
    - BFI_N
